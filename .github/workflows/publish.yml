name: Publish GHCR Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up QEMU emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: ./src/web
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/soggyhammydev/axe-webhooks-web:latest

      - name: Build and push watcher
        uses: docker/build-push-action@v7
        with:
          context: ./src/watcher
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/SoggyHammyDev/axe-webhooks-watcher:latest
